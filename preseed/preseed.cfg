# Debian 13 (trixie) preseed for the Latticed netinst ISO. Skeleton: replace
# every CHANGEME placeholder before building an ISO. The ISO build step that
# bakes this file and the latticed/ repo onto the image is not part of this change yet.

#### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string CHANGEME

#### Network
d-i netcfg/choose_interface select auto
# Placeholder hostname; set to your own, or leave netcfg to the DHCP-provided one.
d-i netcfg/get_hostname string latticed
d-i netcfg/get_domain string localdomain

#### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#### Account
# Root account disabled; the first user administers via sudo (default on Debian).
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Latticed User
d-i passwd/username string CHANGEME
# Crypt hash placeholder. Generate a real one with: openssl passwd -6
d-i passwd/user-password-crypted string $6$CHANGEME$CHANGEMECHANGEMECHANGEMECHANGEMECHANGEMECHANGEMECHANGEME

#### Partitioning: guided, whole disk, no confirmation prompts
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Packages: no desktop tasks, just the base install.sh needs
tasksel tasksel/first multiselect
d-i pkgsel/include string sudo git curl ca-certificates
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

#### Late command: stage the repo and the firstboot unit into /target
d-i preseed/late_command string \
  cp -a /cdrom/latticed /target/opt/latticed ; \
  cp /cdrom/latticed/preseed/firstboot/latticed-firstboot.service /target/etc/systemd/system/ ; \
  in-target systemctl enable latticed-firstboot.service ; \
  in-target sh -c 'echo "CHANGEME ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/90-latticed-firstboot'
